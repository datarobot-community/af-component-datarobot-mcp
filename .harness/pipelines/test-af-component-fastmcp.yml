pipeline:
  name: Test FastMCP Component
  identifier: Build_af_component_fastmcp_backend_1752223405520
  projectIdentifier: afcomponentfastmcpbackend
  orgIdentifier: buzok
  stages:
    - stage:
        name: Test FastMCP
        identifier: Test_Component_FastMCP
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
              - step:
                  type: Run
                  name: Copy with copier and install dependencies
                  identifier: Install_dependencies_and_copy_with_copier
                  spec:
                    connectorRef: GHCR_HHI
                    image: ghcr.io/astral-sh/uv:<+matrix.python>-bookworm-slim
                    shell: Sh
                    command: |-
                      apt -o Acquire::Check-Valid-Until=false update && apt install -y git g++
                      uvx copier copy . ./copier_context_<+matrix.python> --defaults --data mcp_template_framework=
                      cd ./copier_context_<+matrix.python>/mcp_server
                      uvx --from go-task-bin task install
                    envVariables:
                      UV_CACHE_DIR: /.uv_cache
                      UV_PYTHON: <+matrix.python>
              - parallel:
                  - step:
                      type: Run
                      name: Linter
                      identifier: Linter
                      spec:
                        connectorRef: GHCR_HHI
                        image: ghcr.io/astral-sh/uv:<+matrix.python>-bookworm-slim
                        shell: Sh
                        command: |-
                          cd ./copier_context_<+matrix.python>/mcp_server
                          uvx --from go-task-bin task lint-check
                        envVariables:
                          UV_CACHE_DIR: /.uv_cache
                          UV_PYTHON: <+matrix.python>
                  - step:
                      type: Run
                      name: Unit Tests
                      identifier: Unit_Tests
                      spec:
                        connectorRef: GHCR_HHI
                        image: ghcr.io/astral-sh/uv:<+matrix.python>-bookworm-slim
                        shell: Sh
                        command: |-
                          cd ./copier_context_<+matrix.python>/mcp_server
                          uvx --from go-task-bin task test
                        envVariables:
                          UV_CACHE_DIR: /.uv_cache
                          UV_PYTHON: <+matrix.python>
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          caching:
            enabled: true
            paths:
              - /.uv_cache
              - /var/cache/apt/archives
              - /var/lib/apt/lists
          buildIntelligence:
            enabled: true
          sharedPaths:
            - /.uv_cache
            - /var/cache/apt/archives
            - /var/lib/apt/lists
        strategy:
          matrix:
            python:
              - python3.11
              - python3.12
              - python3.13
            nodeName: <+matrix.python>
  properties:
    ci:
      codebase:
        connectorRef: account.svc_harness_git1
        repoName: af-component-fastmcp-backend
        build: <+input>
        sparseCheckout: []
