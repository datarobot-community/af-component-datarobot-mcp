pipeline:
  name: Test FastMCP Component
  identifier: Build_af_component_fastmcp_backend_1752223405520
  projectIdentifier: afcomponentfastmcpbackend
  orgIdentifier: buzok
  stages:
    - parallel:
        - stage:
            name: Test FastMCP
            identifier: Test_Component_FastMCP
            description: ""
            type: CI
            spec:
              cloneCodebase: true
              execution:
                steps:
                  - step:
                      type: Run
                      name: Copy with copier and install dependencies
                      identifier: Install_dependencies_and_copy_with_copier
                      spec:
                        connectorRef: account.GHCR
                        image: ghcr.io/astral-sh/uv:<+matrix.python>-bookworm-slim
                        shell: Sh
                        command: |-
                          apt -o Acquire::Check-Valid-Until=false update && apt install -y git g++
                          uvx copier copy . ./copier_context \
                            --data fastmcp_app_name=mcp_server \
                            --data mcp_template_framework=base_with_tools \
                            --data port=8000 \
                            --data year=2025 \
                            --data base_answers_file=.datarobot/answers/base.yml
                          cd ./copier_context/mcp_server_with_tools
                          uvx --from go-task-bin task install
                        envVariables:
                          UV_CACHE_DIR: /.uv_cache
                  - parallel:
                      - step:
                          type: Run
                          name: Linter
                          identifier: Linter
                          spec:
                            connectorRef: account.GHCR
                            image: ghcr.io/astral-sh/uv:<+matrix.python>-bookworm-slim
                            shell: Sh
                            command: |-
                              cd ./copier_context/mcp_server
                              uvx --from go-task-bin task lint-check
                            envVariables:
                              UV_CACHE_DIR: /.uv_cache
                      - step:
                          type: Run
                          name: Unit Tests
                          identifier: Unit_Tests
                          spec:
                            connectorRef: account.GHCR
                            image: ghcr.io/astral-sh/uv:<+matrix.python>-bookworm-slim
                            shell: Sh
                            command: |-
                              cd ./copier_context/mcp_server
                              uvx --from go-task-bin task test
                            envVariables:
                              UV_CACHE_DIR: /.uv_cache
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              caching:
                enabled: true
                paths:
                  - /.uv_cache
                  - /var/cache/apt/archives
                  - /var/lib/apt/lists
              buildIntelligence:
                enabled: true
              sharedPaths:
                - /.uv_cache
                - /var/cache/apt/archives
                - /var/lib/apt/lists
            strategy:
              matrix:
                python:
                  - python3.10
                  - python3.11
                  - python3.12
                nodeName: <+matrix.python>
        - stage:
            name: Test Component Infra
            identifier: Test_Component_Infra
            description: ""
            type: CI
            spec:
              cloneCodebase: true
              execution:
                steps:
                  - step:
                      type: Run
                      name: Copy with copier and install dependencies
                      identifier: Install_dependencies_and_copy_with_copier
                      spec:
                        connectorRef: account.GHCR
                        image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
                        shell: Sh
                        command: |-
                          apt -o Acquire::Check-Valid-Until=false update && apt install -y git
                          uvx copier copy . ./copier_context --defaults
                          cp ./fixtures/Taskfile.yml ./copier_context/Taskfile.yml
                          cp ./fixtures/infra/Pulumi.yaml ./copier_context/infra/Pulumi.yaml
                          cp ./fixtures/infra/pyproject.toml ./copier_context/infra/pyproject.toml
                          cp ./fixtures/infra/__init__.py ./copier_context/infra/infra/__init__.py
                          cd ./copier_context/infra
                          uv sync --all-extras --all-groups --dev
                        envVariables:
                          UV_CACHE_DIR: /.uv_cache
                  - parallel:
                      - step:
                          type: Run
                          name: Linter
                          identifier: Linter
                          spec:
                            connectorRef: GHCR_HHI
                            image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
                            shell: Sh
                            command: |-
                              cd ./copier_context/infra
                              uv run ruff format --check --diff .
                              uv run ruff check --diff .
                              uv run mypy --pretty .
                            envVariables:
                              UV_CACHE_DIR: /.uv_cache
                      - step:
                          type: Run
                          name: Unit Tests
                          identifier: Unit_Tests
                          spec:
                            connectorRef: GHCR_HHI
                            image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
                            shell: Sh
                            command: |-
                              apt install -y curl
                              curl -fsSL https://get.pulumi.com | sh
                              export PATH=/root/.pulumi/bin:$PATH
                              cd ./copier_context/infra
                              pulumi login --local
                              pulumi stack init -s organization/unittest/unittest
                              uv run pytest -vv --cov --cov-report=html --cov-report=term --cov-report xml:.coverage.xml ./tests/
                            envVariables:
                              UV_CACHE_DIR: /.uv_cache
                              PULUMI_CONFIG_PASSPHRASE: "123"
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              caching:
                enabled: true
                paths:
                  - /.uv_cache
                  - /var/cache/apt/archives
                  - /var/lib/apt/lists
              buildIntelligence:
                enabled: true
              sharedPaths:
                - /.uv_cache
                - /var/cache/apt/archives
                - /var/lib/apt/lists
  properties:
    ci:
      codebase:
        connectorRef: account.svc_harness_git1
        repoName: af-component-fastmcp-backend
        build: <+input>
        sparseCheckout: []
