[project]
name = "infra"
version = "0.0.1"
description = """
This is a fixture for DataRobot MCP Server infra tests.
"""
requires-python = ">=3.11"

dependencies = [
    # TODO: raise to the datarobot-pulumi-utils release that adds
    # RuntimeEnvironments.PYTHON_3_MCP (mcp_execution_environment.py then drops
    # its search fallback for the default EE name).
    "datarobot-pulumi-utils>=0.1.2",
    "pulumi>=3.252.0",
    "pulumi-datarobot>=0.11.1",
    "pytz>=2024.1"
]


[project.optional-dependencies]
dev = [
    "pytest-cov>=6.1.1",
    "pytest>=7.4.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
