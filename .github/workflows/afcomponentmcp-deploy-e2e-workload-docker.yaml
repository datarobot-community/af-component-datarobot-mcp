---
name: E2E
on:
  pull_request:
    # TODO: drop "anatolii/BUZZOK-31992" once PR #58 merges and this PR retargets main.
    branches: ["main", "anatolii/BUZZOK-31992"]
    paths:
      - "fixtures/e2e/**"
      - "template/**"
      - "copier.yml"
      - ".github/workflows/reusable-deploy-e2e.yaml"
      - ".github/workflows/afcomponentmcp-deploy-e2e-workload-docker.yaml"
  push:
    branches: ["main"]
    paths:
      - "fixtures/e2e/**"
      - "template/**"
      - "copier.yml"
      - ".github/workflows/reusable-deploy-e2e.yaml"
      - ".github/workflows/afcomponentmcp-deploy-e2e-workload-docker.yaml"
  workflow_dispatch:
    inputs:
      skip_destroy:
        description: "Skip pulumi destroy after deploy (debug only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
concurrency:
  group: deploy-e2e-workload-docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  # Job name is the middle check-name segment; the workflow name is the
  # shared "E2E" prefix -> checks read: E2E / workload-docker / Deploy|Destroy.
  e2e:
    name: workload-docker
    uses: ./.github/workflows/reusable-deploy-e2e.yaml
    secrets: inherit
    with:
      use-case-id: workload-docker
      skip-destroy: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_destroy == 'true' && 'true' || 'false' }}
