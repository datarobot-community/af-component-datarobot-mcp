---
name: af-component-datarobot-mcp Server
on:
  workflow_call:
    inputs:
      git-ref:
        description: "Optional commit or branch to checkout (used after uv.lock bot push)"
        required: false
        type: string
        default: ""
  push:
    branches: ["main"]
    paths:
      - "fixtures/**"
      - "template/**"
      - "copier.yml"
      - ".github/workflows/afcomponentmcp-server-test.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "fixtures/**"
      - "template/**"
      - "!template/{{mcp_app_name_file}}/pyproject.toml.jinja"
      - "copier.yml"
      - ".github/workflows/afcomponentmcp-server-test.yaml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dep-pr-filter:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-dep-pr-paths-filter.yaml

  test-mcp-server:
    name: "Test MCP Server Startup & Tools"
    needs: dep-pr-filter
    if: >-
      always() &&
      (github.event_name == 'workflow_call' ||
      (github.event_name == 'pull_request' &&
      needs.dep-pr-filter.result == 'success' &&
      needs.dep-pr-filter.outputs.pyproject != 'true') ||
      github.event_name == 'push')
    runs-on: "ubuntu-latest"
    container:
      image: ghcr.io/astral-sh/uv:python3.11-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (reusable / workflow_call)
        if: github.event_name == 'workflow_call'
        uses: "actions/checkout@v6"
        with:
          ref: ${{ inputs.git-ref != '' && inputs.git-ref || github.ref }}

      - name: Checkout
        if: github.event_name != 'workflow_call'
        uses: "actions/checkout@v6"
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Setup caching
        uses: ./.github/actions/setup-caching
        with:
          python-version: python3.11
          cache-key-suffix: mcp-server
          dependency-files: |
            template/{{mcp_app_name_file}}/pyproject.toml.jinja
            template/{{mcp_app_name_file}}/uv.lock.jinja

      - name: Render template
        uses: ./.github/actions/render-copier-instance
        with:
          copier-args: "--defaults --trust --vcs-ref=HEAD"

      - name: Check uv.lock is up to date
        working-directory: ./rendered/mcp_server
        run: |
          echo "Checking uv.lock matches pyproject.toml. If this fails, run 'task lock' at the repo root and commit the regenerated template/{{mcp_app_name_file}}/uv.lock.jinja."
          uv lock --check
        env:
          UV_CACHE_DIR: /.uv_cache

      - name: Install dependencies
        working-directory: ./rendered/mcp_server
        run: uv sync --all-extras
        env:
          UV_CACHE_DIR: /.uv_cache

      - name: Write server environment
        working-directory: ./rendered/mcp_server
        run: |
          cat > .env <<EOF
          DATAROBOT_ENDPOINT=${DATAROBOT_ENDPOINT}
          SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
          MCP_SERVER_PORT=${MCP_SERVER_PORT}
          MCP_SERVER_REGISTER_DYNAMIC_TOOLS_ON_STARTUP=false
          MCP_SERVER_REGISTER_DYNAMIC_PROMPTS_ON_STARTUP=false
          ENABLE_PREDICTIVE_TOOLS=true
          OTEL_ENABLED=false
          EOF
        env:
          DATAROBOT_ENDPOINT: https://app.datarobot.com
          SESSION_SECRET_KEY: ci-smoke-test-session-secret
          MCP_SERVER_PORT: "8082"

      - name: Start MCP server
        working-directory: ./rendered/mcp_server
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends curl procps >/dev/null
          set -a
          source .env
          set +a
          uv run python app/main.py &
          echo $! > /tmp/mcp-server.pid
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${MCP_SERVER_PORT}/" >/dev/null 2>&1; then
              echo "MCP server is ready"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/mcp-server.pid)" 2>/dev/null; then
              echo "MCP server process exited before becoming ready"
              exit 1
            fi
            sleep 1
          done
          echo "Timed out waiting for MCP server"
          exit 1
        env:
          UV_CACHE_DIR: /.uv_cache

      - name: List MCP tools
        working-directory: ./rendered/mcp_server
        run: uv run python "${GITHUB_WORKSPACE}/fixtures/mcp/smoke_list_tools.py"
        env:
          UV_CACHE_DIR: /.uv_cache
          MCP_SERVER_URL: http://localhost:8082/mcp/
          MCP_SMOKE_EXPECTED_PREDICTIVE_TOOLS: "34"

      - name: Stop MCP server
        if: always()
        run: |
          if [ -f /tmp/mcp-server.pid ]; then
            kill "$(cat /tmp/mcp-server.pid)" 2>/dev/null || true
          fi
          pkill -f "app/main.py" 2>/dev/null || true
