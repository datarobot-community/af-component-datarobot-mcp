---
name: af-component-datarobot-mcp Server
on:
  push:
    branches: ["main"]
    paths:
      - "fixtures/**"
      - "template/**"
      - "copier.yml"
      - ".github/workflows/afcomponentmcp-server-test.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "fixtures/**"
      - "template/**"
      - "copier.yml"
      - ".github/workflows/afcomponentmcp-server-test.yaml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  test-mcp-server:
    name: "Test MCP Server Startup & Tools"
    runs-on: "ubuntu-latest"
    container:
      image: ghcr.io/astral-sh/uv:python3.11-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
        with:
          # Only pin to the PR head branch for a same-repo PR — that's the one case
          # where a later step here pushes a fix and needs an accurate parent commit.
          # Fork PRs and push events keep the default (safe, doesn't attempt a push).
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && github.head_ref || github.ref }}

      - name: Setup caching
        uses: ./.github/actions/setup-caching
        with:
          python-version: python3.11
          cache-key-suffix: mcp-server
          dependency-files: |
            template/{{mcp_app_name_file}}/pyproject.toml.jinja
            template/{{mcp_app_name_file}}/uv.lock.jinja

      - name: Render template
        uses: ./.github/actions/render-copier-instance
        with:
          copier-args: "--defaults --trust --vcs-ref=HEAD"

      - name: Check uv.lock is up to date
        id: lock_check
        working-directory: ./rendered/mcp_server
        continue-on-error: true
        run: |
          echo "Checking uv.lock matches pyproject.toml. If this fails, run 'task lock' at the repo root and commit the regenerated template/{{mcp_app_name_file}}/uv.lock.jinja."
          uv lock --check
        env:
          UV_CACHE_DIR: /.uv_cache

      # Fixes and continues in the SAME run — no second triggered run, so no
      # bot-actor approval gate ever comes into play. The freshly regenerated
      # ./rendered/mcp_server/uv.lock is what the rest of this job installs
      # and tests against; the push just carries the fix back to the branch.
      - name: Regenerate stale uv.lock and push it to this PR branch
        if: steps.lock_check.outcome == 'failure' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          uv lock --directory ./rendered/mcp_server
          python3 <<'PYEOF'
          content = open("./rendered/mcp_server/uv.lock").read()
          content = content.replace(
              'name = "mcp-server"',
              'name = "{{ mcp_app_name | replace("_", "-") }}"',
              1,
          )
          open("./template/{{mcp_app_name_file}}/uv.lock.jinja", "w").write(content)
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "./template/{{mcp_app_name_file}}/uv.lock.jinja"
          git commit -m "chore: regenerate uv.lock"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
        env:
          UV_CACHE_DIR: /.uv_cache

      # Only reached when we couldn't self-heal: a fork PR (can't push to someone
      # else's fork) or a push straight to main (auto-committing there is worse
      # than failing loudly). A same-repo PR never hits this — it's fixed above.
      - name: Fail if uv.lock was stale and could not be auto-fixed
        if: steps.lock_check.outcome == 'failure' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          echo "::error::uv.lock is out of date with pyproject.toml. Run 'task lock' at the repo root, commit the regenerated template/{{mcp_app_name_file}}/uv.lock.jinja, and push."
          exit 1

      - name: Install dependencies
        working-directory: ./rendered/mcp_server
        run: uv sync --all-extras
        env:
          UV_CACHE_DIR: /.uv_cache

      - name: Write server environment
        working-directory: ./rendered/mcp_server
        run: |
          cat > .env <<EOF
          DATAROBOT_ENDPOINT=${DATAROBOT_ENDPOINT}
          SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
          MCP_SERVER_PORT=${MCP_SERVER_PORT}
          MCP_SERVER_REGISTER_DYNAMIC_TOOLS_ON_STARTUP=false
          MCP_SERVER_REGISTER_DYNAMIC_PROMPTS_ON_STARTUP=false
          ENABLE_PREDICTIVE_TOOLS=true
          OTEL_ENABLED=false
          EOF
        env:
          DATAROBOT_ENDPOINT: https://app.datarobot.com
          SESSION_SECRET_KEY: ci-smoke-test-session-secret
          MCP_SERVER_PORT: "8082"

      - name: Start MCP server
        working-directory: ./rendered/mcp_server
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends curl procps >/dev/null
          set -a
          source .env
          set +a
          uv run python app/main.py &
          echo $! > /tmp/mcp-server.pid
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${MCP_SERVER_PORT}/" >/dev/null 2>&1; then
              echo "MCP server is ready"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/mcp-server.pid)" 2>/dev/null; then
              echo "MCP server process exited before becoming ready"
              exit 1
            fi
            sleep 1
          done
          echo "Timed out waiting for MCP server"
          exit 1
        env:
          UV_CACHE_DIR: /.uv_cache

      - name: List MCP tools
        working-directory: ./rendered/mcp_server
        run: uv run python "${GITHUB_WORKSPACE}/fixtures/mcp/smoke_list_tools.py"
        env:
          UV_CACHE_DIR: /.uv_cache
          MCP_SERVER_URL: http://localhost:8082/mcp/
          MCP_SMOKE_EXPECTED_PREDICTIVE_TOOLS: "34"

      - name: Stop MCP server
        if: always()
        run: |
          if [ -f /tmp/mcp-server.pid ]; then
            kill "$(cat /tmp/mcp-server.pid)" 2>/dev/null || true
          fi
          pkill -f "app/main.py" 2>/dev/null || true
