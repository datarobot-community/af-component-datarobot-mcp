---
name: Reusable Deploy E2E
on:
  workflow_call:
    inputs:
      use-case-id:
        description: "Key from fixtures/e2e/use-cases.yaml"
        required: true
        type: string
      skip-destroy:
        description: "Skip pulumi destroy after deploy (debug only)"
        required: false
        default: "false"
        type: string
    secrets:
      DATAROBOT_API_TOKEN:
        required: true
      PULUMI_ACCESS_TOKEN:
        required: false
      PULUMI_CONFIG_PASSPHRASE:
        required: false
jobs:
  deploy-e2e:
    name: "Deploy E2E (${{ inputs.use-case-id }})"
    runs-on: "ubuntu-latest"
    timeout-minutes: 180
    container:
      image: ghcr.io/astral-sh/uv:python3.11-bookworm
    defaults:
      run:
        shell: bash
    env:
      UV_CACHE_DIR: /.uv_cache
      DATAROBOT_API_TOKEN: ${{ secrets.DATAROBOT_API_TOKEN }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      DATAROBOT_ENDPOINT: ${{ vars.DATAROBOT_ENDPOINT != '' && vars.DATAROBOT_ENDPOINT || 'https://app.datarobot.com/api/v2' }}
      USE_CASE_ID: ${{ inputs.use-case-id }}
      SKIP_DESTROY: ${{ inputs.skip-destroy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Load use case
        run: |
          set -euo pipefail
          uvx --with pyyaml python "${GITHUB_WORKSPACE}/fixtures/e2e/load_use_case.py" "${USE_CASE_ID}" >> "${GITHUB_ENV}"
          echo "STACK_NAME=ci-e2e-${USE_CASE_ID}-${GITHUB_RUN_ID}" >> "${GITHUB_ENV}"
          echo "SESSION_SECRET_KEY=ci-e2e-${USE_CASE_ID}-${GITHUB_RUN_ID}" >> "${GITHUB_ENV}"

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "/github/home/.pulumi/bin" >> "${GITHUB_PATH}"

      - name: Render template
        uses: ./.github/actions/render-copier-instance
        with:
          copier-args: "--defaults --trust --vcs-ref=HEAD"

      - name: Install Task
        uses: arduino/setup-task@v2

      - name: Run deployment E2E
        run: bash "${GITHUB_WORKSPACE}/fixtures/e2e/run_deploy_e2e.sh"
        env:
          RENDERED_DIR: ./rendered
          DATAROBOT_API_TOKEN: ${{ secrets.DATAROBOT_API_TOKEN }}
          DATAROBOT_ENDPOINT: ${{ vars.DATAROBOT_ENDPOINT != '' && vars.DATAROBOT_ENDPOINT || 'https://app.datarobot.com/api/v2' }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE != '' && secrets.PULUMI_CONFIG_PASSPHRASE || 'ci-e2e-pulumi-passphrase' }}
