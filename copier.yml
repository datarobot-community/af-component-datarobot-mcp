---
# questions
mcp_app_name:
  type: str
  default: "mcp_server"
  help: "The name/folder of your DataRobot MCP Web App. Required to use a python friendly name like mcp_server or mcp_deployments"
  # Two things this must hold, both of which produce a broken project rather than
  # a clear error if they are not checked here:
  #   * lower-case snake_case identifier — every directory, import and path
  #     reference renders from `mcp_app_name_file`, whose normalization only
  #     lower-cases and maps `-` to `_`, so a name with spaces, dots or a
  #     leading digit still emits packages that do not import. Requiring the
  #     raw name to equal its normalization keeps its one remaining use —
  #     display labels — the same string as the directories on disk.
  #   * at most 28 characters — the generated infra is ruff-formatted to 88
  #     columns; past 28 the app name pushes import lines over and
  #     `ruff format --check` fails in CI. Verified empirically: 28 is clean, 29 is not.
  validator: "{% if mcp_app_name != (mcp_app_name | lower | replace('-', '_')) or not mcp_app_name.isidentifier() %}Must be a lower-case Python identifier (letters, digits and underscores, not starting with a digit), e.g. mcp_server{% elif mcp_app_name | length > 28 %}Must be at most 28 characters, otherwise the generated code exceeds ruff's 88-column line limit{% endif %}"

mcp_app_name_file:
  type: str
  default: "{{mcp_app_name|lower|replace('-','_')}}"
  when: false

copyright_year:
  type: int
  default: 2026
  help: "The current year to register copyright properly in the license file"

mcp_development_port:
  type: int
  default: 8080
  help: "The local port to run your DataRobot MCP development server on"
  validator: "{% if mcp_development_port < 1 or mcp_development_port > 65535%}Must be in the range 1-65535{% endif %}"

_subdirectory: template
_answers_file: ".datarobot/answers/drmcp-{{ mcp_app_name }}.yml"

# Files to be excluded
_exclude:
  - "*.j2"
