---
# questions
mcp_app_name:
  type: str
  default: "mcp_server"
  help: "The name/folder of your DataRobot MCP Web App. Required to use a python friendly name like mcp_server or mcp_deployments"
  agent_guidance:
    ask_user: false
    reason: "Use the default 'mcp_server'; only ask if the user has a specific naming requirement."

mcp_app_name_file:
  type: str
  default: "{{mcp_app_name|lower|replace('-','_')}}"
  when: false

copyright_year:
  type: int
  default: 2026
  help: "The current year to register copyright properly in the license file"
  agent_guidance:
    ask_user: false
    reason: "Use the current calendar year as the default; no user input needed."

mcp_development_port:
  type: int
  default: 8080
  help: "The local port to run your DataRobot MCP development server on"
  agent_guidance:
    ask_user: false
    reason: "8080 is a safe local development default; only ask if the user reports a port conflict."
  validator: "{% if mcp_development_port < 1 or mcp_development_port > 65535%}Must be in the range 1-65535{% endif %}"

_subdirectory: template
_answers_file: ".datarobot/answers/drmcp-{{ mcp_app_name }}.yml"

# Regenerate uv.lock so the root package name matches the chosen mcp_app_name.
_tasks:
  - command: ["uv", "lock"]
    working_directory: "{{ mcp_app_name }}"

# Files to be excluded
_exclude:
  - "*.j2"
