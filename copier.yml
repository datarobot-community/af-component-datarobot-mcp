# questions
fastmcp_app_name:
  type: str
  default: "mcp_server"
  help: "The name/folder of your FastMCP Web App. Required to use a python friendly name like mcp_server or mcp_deployments"

mcp_template_framework:
  type: str
  default: "base"
  help: "The MCP framework template to start with. Supported frameworks: base, base_with_tools"

fastmcp_local_port:
  type: int
  default: "8000"
  help: "The port to run this FastMCP Web App"

copyright_year:
  type: int
  default: 2025
  help: "The current year to register copyright properly in the license file"

base_answers_file:
  type: str
  default: ".datarobot/answers/base.yml"
  help: "Path to the base component answers file"

# Grab the base component answers to re-use answers
_external_data:
  base: "{{ base_answers_file }}"

_subdirectory: template
_answers_file: ".datarobot/answers/fastmcp-{{ fastmcp_app_name }}.yml"

# Exclude tool and test files when using base framework
_exclude: "[[ mcp_template_framework == 'base' and [
    '{{fastmcp_app_name}}/app/base/tools/data.py',
    '{{fastmcp_app_name}}/app/base/tools/deployment_info.py',
    '{{fastmcp_app_name}}/app/base/tools/deployment.py',
    '{{fastmcp_app_name}}/app/base/tools/model.py',
    '{{fastmcp_app_name}}/app/base/tools/predict_realtime.py',
    '{{fastmcp_app_name}}/app/base/tools/predict.py',
    '{{fastmcp_app_name}}/app/base/tools/project.py',
    '{{fastmcp_app_name}}/app/base/tools/training.py',
    '{{fastmcp_app_name}}/app/base/tests/ete/test_data.py',
    '{{fastmcp_app_name}}/app/base/tests/ete/test_deployment_info.py',
    '{{fastmcp_app_name}}/app/base/tests/ete/test_deployment.py',
    '{{fastmcp_app_name}}/app/base/tests/ete/test_model.py',
    '{{fastmcp_app_name}}/app/base/tests/ete/test_projects.py',
    '{{fastmcp_app_name}}/app/base/tests/integration/test_deployment_info.py',
    '{{fastmcp_app_name}}/app/base/tests/integration/test_model.py',
    '{{fastmcp_app_name}}/app/base/tests/integration/test_predict_realtime.py',
    '{{fastmcp_app_name}}/app/base/tests/unit/test_data.py',
    '{{fastmcp_app_name}}/app/base/tests/unit/test_deployment_info.py',
    '{{fastmcp_app_name}}/app/base/tests/unit/test_deployment.py',
    '{{fastmcp_app_name}}/app/base/tests/unit/test_predict_realtime.py',
    '{{fastmcp_app_name}}/app/base/tests/unit/test_predict.py',
    '{{fastmcp_app_name}}/app/base/tests/unit/test_project.py',
    '{{fastmcp_app_name}}/app/base/tests/unit/test_model.py'
] or [] ]]"

