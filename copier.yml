---
# questions
fastmcp_app_name:
  type: str
  default: "mcp_server"
  help: "The name/folder of your FastMCP Web App. Required to use a python friendly name like mcp_server or mcp_deployments"

mcp_template_framework:
  type: str
  default: "base_with_tools"
  help: "The MCP framework template to start with. Supported frameworks: base, base_with_tools"


fastmcp_local_port:
  type: int
  default: "8000"
  help: "The port to run this FastMCP Web App"

copyright_year:
  type: int
  default: 2025
  help: "The current year to register copyright properly in the license file"

base_answers_file:
  type: str
  default: ".datarobot/answers/base.yml"
  help: "Path to the base component answers file"

# Grab the base component answers to re-use answers
_external_data:
  base: "{{ base_answers_file }}"

_subdirectory: template
_answers_file: ".datarobot/answers/fastmcp-{{ fastmcp_app_name }}.yml"

# Files to be excluded
_exclude:
  - "{% if mcp_template_framework == 'base' %}{{fastmcp_app_name}}/app/base/tools/data.py{% endif %}"
  - "{% if mcp_template_framework == 'base' %}{{fastmcp_app_name}}/app/base/tools/deployment_info.py{% endif %}"
